site_name: E資格 動く数式ノート
site_description: E資格（JDLA Deep Learning for ENGINEER）の範囲を、数式の要点と、数式・図・数値が連動して動く図でまとめたノートです。
site_url: https://minnanosaiban.github.io/e-shikaku/
site_dir: site

nav:
  - ホーム: index.md
  - 数学:
      - 行列演算・ランク: math/linear-algebra.md
      - 固有値分解・特異値分解: math/eigen-svd.md
      - 確率分布・ベイズの定理: math/probability.md
      - 確率過程: math/stochastic-process.md
      - パラメータ推定: math/estimation.md
      - 情報理論: math/information-theory.md
      - 最適化理論: math/optimization.md
      - 損失関数まとめ: math/loss.md
  - 機械学習:
      - パターン認識・k近傍法: ml/pattern-knn.md
      - 線形回帰・正則化: ml/linear-regression.md
      - ロジスティック回帰: ml/logistic.md
      - SVM: ml/svm.md
      - 決定木・アンサンブル: ml/tree-ensemble.md
      - ナイーブベイズ・GP・CRF: ml/bayes-gp-crf.md
      - 次元圧縮: ml/dimension-reduction.md
      - クラスタリング: ml/clustering.md
      - 自己教師あり学習・生成モデル: ml/ssl-generative.md
      - 課題・検証・性能指標: ml/evaluation.md
  - 深層学習:
      - 多層パーセプトロン・損失: dl/mlp-loss.md
      - 活性化関数: dl/activation.md
      - 誤差逆伝播法: dl/backprop.md
      - 最適化: dl/optimizer.md
      - パラメータの初期化: dl/init.md
      - 正則化: dl/regularization.md
      - CNN: dl/cnn.md
      - RNN・LSTM・GRU: dl/rnn.md
      - 系列変換・Attention: dl/seq2seq.md
      - Transformer: dl/transformer.md
      - データ拡張: dl/augmentation.md
      - 正規化: dl/normalization.md
      - アンサンブル・ハイパーパラメータ: dl/ensemble-hyperparam.md
  - 深層学習の応用:
      - 画像認識・物体検出: app/vision.md
      - 自然言語処理: app/nlp.md
      - 音声処理: app/speech.md
      - 生成モデル: app/generative.md
      - 強化学習: app/rl.md
      - グラフニューラルネットワーク: app/gnn.md
      - 軽量化・高速化: app/efficiency.md
      - 説明性: app/explainability.md

