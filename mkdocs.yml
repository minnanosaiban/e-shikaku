theme:
  name: material
  variant: classic # Zensical で Material 風の見た目にする指定（MkDocs では無視される）
  language: ja
  custom_dir: overrides # ヘッダーの部品の上書き（サイト名を常にリンクで出す。tomo と同じ）
  font: false # Noto Sans JP を note.css で指定する
  favicon: img/favicon.png
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替えます
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替えます
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer # ページ下部に「前へ・次へ」
    - toc.follow
    - search.highlight

plugins:
  - search:
      lang: ja

validation:
  links:
    not_found: warn

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex: # 数式は KaTeX で描画する（js/katex-init.js）
      generic: true

extra:
  # 「サイト運営者について」は tomo のサイトトップ（hotline と同じ。フッターのリンク先）
  about_url: https://minnanosaiban.github.io/tomo/
